name: Remediate vulnerable npm dependencies

on:
  push:
    branches:
      - feat/bcx-live-thinking-sse
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix

      - name: Commit updated dependency lockfile
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(security): update vulnerable npm dependencies"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No dependency changes were required."
          fi

      - name: Verify high and critical advisories are resolved
        run: npm audit --audit-level=high
