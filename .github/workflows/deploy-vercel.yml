name: Deploy BCX to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target == 'production' && 'vercel-production' || 'vercel-preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Check Vercel configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN in the selected GitHub environment."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID in the selected GitHub environment."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID in the selected GitHub environment."; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="${{ inputs.target }}" --token="$VERCEL_TOKEN"

      - name: Build preview
        if: inputs.target == 'preview'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Build production
        if: inputs.target == 'production'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: inputs.target == 'preview'
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: inputs.target == 'production'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
