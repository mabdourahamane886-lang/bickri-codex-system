name: Temporary dependency remediation

on:
  push:
    branches:
      - fix/bcx-ai-reliability-20261108

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(deps):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply non-breaking security updates
        run: npm audit fix
      - name: Record remaining production audit findings
        run: npm audit --omit=dev --audit-level=high || true
      - uses: actions/upload-artifact@v4
        with:
          name: bcx-remediated-dependencies
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: bcx-remediated-dependencies
          path: .
      - name: Commit the regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): remediate production vulnerabilities"
          git push origin HEAD:${{ github.ref_name }}
